### ===========================================================================
### LLaMA-Factory SFT config — Qwen2.5-7B-Instruct + LoRA
### Usage:
###   llamafactory-cli train configs/sft/qwen2_5_7b_lora_sft.yaml
### Platform: HKUST SuperPOD, 4x H800 80GB
### ===========================================================================

### model
model_name_or_path: /data/models/Qwen2.5-7B-Instruct  # local path on cluster

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### dataset
dataset: leetcode_cot
dataset_dir: data/processed/sft
template: qwen
cutoff_len: 4096
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: checkpoints/sft/qwen2_5_7b_lora
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
val_size: 0.05
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200

### report
report_to: wandb
run_name: qwen2_5_7b_lora_sft_v1

### seed
seed: 42
